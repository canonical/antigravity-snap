name: antigravity
base: core26
version: '2.21.1'
title: Antigravity
summary: Antigravity
icon: snap/gui/icon.png
description: |
  Google Antigravity — Build the new way.

  Your command center to manage multiple local agents in parallel. Group conversations into Projects, operate across multiple workspaces, and automate routine tasks with scheduled messages.
website: https://antigravity.google/
contact: https://antigravity.google/
source-code: https://github.com/canonical/antigravity-snap
issues: https://github.com/canonical/antigravity-snap/issues
license: Apache-2.0

grade: stable
confinement: classic

lint:
  ignore:
    - classic
    - library

platforms:
  amd64:
  arm64:

apps:
  antigravity:
    command: opt/antigravity/antigravity
    desktop: share/applications/antigravity.desktop

parts:
  antigravity:
    plugin: dump
    source: .
    override-pull: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          URL=https://storage.googleapis.com/antigravity-public/antigravity-hub/2.21.1-5614635819335680/linux-x64/Antigravity.tar.gz
          DIR=Antigravity-x64
          ;;
        arm64)
          URL=https://storage.googleapis.com/antigravity-public/antigravity-hub/2.21.1-5614635819335680/linux-arm/Antigravity.tar.gz
          DIR=Antigravity-arm64
          ;;
        *)
          echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"
          exit 1
          ;;
      esac
      curl -L "$URL" | tar -xz
      mkdir -p opt
      mv "$DIR" opt/antigravity

    override-build: |
      craftctl default

      install -Dm644 "$CRAFT_PROJECT_DIR/snap/icon.png" "$CRAFT_PART_INSTALL/share/icons/hicolor/256x256/apps/antigravity.png"
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/local/antigravity.desktop" "$CRAFT_PART_INSTALL/share/applications/antigravity.desktop"

      # Arm an AppArmor onexec transition in the main process so everything it
      # spawns runs unconfined, while the desktop app keeps the snap label that
      # the dock uses to group its windows. See snap/local/apparmor-onexec.js.
      npm install --no-save @electron/asar
      npx @electron/asar extract "$CRAFT_PART_INSTALL/opt/antigravity/resources/app.asar" asar-extracted
      cat "$CRAFT_PROJECT_DIR/snap/local/apparmor-onexec.js" asar-extracted/dist/main.js > asar-extracted/dist/main.js.tmp
      mv asar-extracted/dist/main.js.tmp asar-extracted/dist/main.js
      npx @electron/asar pack asar-extracted "$CRAFT_PART_INSTALL/opt/antigravity/resources/app.asar"
      rm -rf asar-extracted node_modules package-lock.json
    build-packages:
      - curl
      - nodejs
      - npm
