name: Snap CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'automation/update-antigravity-')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        with:
          snapcraft-args: pack --build-for=${{ matrix.arch }}

      - name: Prepare snapd
        run: |
          sudo snap wait system seed.loaded
          [ -d /snap ] || sudo ln -s /var/lib/snapd/snap /snap

      - name: Smoke test snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo snap install --dangerous --classic "${SNAP_FILE}"
          snap run --shell antigravity -c 'test -x "$SNAP/opt/antigravity/antigravity"'

      - name: Remove test install
        if: always()
        run: sudo snap remove --purge antigravity || true

      - name: Upload snap artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  automerge:
    name: Auto-merge release PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'automation/update-antigravity-')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          changed_files="$(gh pr diff "${PR_URL}" --name-only)"
          if [ "${changed_files}" != "snap/snapcraft.yaml" ]; then
            echo "Unexpected files modified in release PR: ${changed_files}"
            exit 1
          fi

          # Verify all commits in the PR are authored exclusively by github-actions[bot]
          non_bot_authors="$(gh pr view "${PR_URL}" --json commits --jq '[.commits[].authors[].login | select(. != "github-actions[bot]")] | length')"
          if [ "${non_bot_authors}" -ne 0 ]; then
            echo "PR contains commits from unauthorized authors"
            exit 1
          fi

          gh pr merge "${PR_URL}" --squash --delete-branch

  publish-edge:
    name: Publish to latest/edge (${{ matrix.arch }})
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment:
      name: latest/edge
      deployment: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snap-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}

      - name: Select snap file
        id: snap
        run: |
          snap_file="$(find "dist/${{ matrix.arch }}" -maxdepth 1 -name '*.snap' | head -n1)"
          test -n "${snap_file}"
          echo "path=${snap_file}" >> "${GITHUB_OUTPUT}"

      - name: Publish snaps to edge
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: latest/edge

  release:
    name: Create GitHub release
    needs: publish-edge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk '/^version:/ {print $2}' snap/snapcraft.yaml | tr -d "'\"")"
          tag="v${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping."
            exit 0
          fi

          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --generate-notes

