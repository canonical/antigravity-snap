name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  cla-check:
    name: Canonical CLA check
    runs-on: ubuntu-24.04
    steps:
      - name: Check CLA
        uses: canonical/has-signed-canonical-cla@19bae73390fdbfdc1ef9a9bb9408d87a1de755f6 # v2
        with:
          bot-accounts: '["dependabot[bot]"]'
